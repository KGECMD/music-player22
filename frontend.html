<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Harmony Player v5</title>

<style>
body {
  margin:0;
  font-family:system-ui;
  background:#0a0a0a;
  color:white;
  display:grid;
  grid-template-columns:320px 1fr 420px;
  height:100vh;
}

.panel { padding:14px; border-right:1px solid #222; }
.glass { background:rgba(255,255,255,0.05); backdrop-filter:blur(18px); }

input {
  width:100%;
  padding:12px;
  background:#111;
  border:1px solid #333;
  color:white;
  border-radius:10px;
}

button {
  width:100%;
  margin-top:8px;
  padding:10px;
  border-radius:10px;
  background:#1a1a1a;
  color:white;
  border:1px solid #333;
}

.item {
  padding:10px;
  margin-top:10px;
  background:#111;
  border-radius:10px;
  cursor:pointer;
}

iframe {
  width:100%;
  height:100%;
  border:none;
}
</style>
</head>

<body>

<div class="panel glass">
  <h2>Harmony v5</h2>

  <input id="q" placeholder="Search music..." />
  <button onclick="search()">Search</button>

  <div id="results"></div>
</div>

<div class="panel glass">
  <h3>Now Playing</h3>
  <div id="now">Nothing</div>

  <audio id="audio" controls></audio>
</div>

<div>
  <iframe id="frame"></iframe>
</div>

<script>
async function search() {
  const q = document.getElementById("q").value;

  const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
  const data = await res.json();

  const results = document.getElementById("results");
  results.innerHTML = "";

  data.forEach(track => {
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `
      <b>${track.title}</b><br/>
      <small>${track.artist}</small>
    `;

    div.onclick = () => play(track);

    results.appendChild(div);
  });
}

function play(track) {
  document.getElementById("now").innerText =
    track.title + " - " + track.artist;

  document.getElementById("audio").src = track.preview;

  // optional iframe “visual shell”
  document.getElementById("frame").src =
    "about:blank";
}
</script>

</body>
</html>
