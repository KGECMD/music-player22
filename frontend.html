<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Harmony v7</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h2>Harmony</h2>

    <button onclick="view('search')">Search</button>
    <button onclick="view('queue')">Queue</button>

    <div class="mini-player">
      <div id="now">Nothing playing</div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- SEARCH VIEW -->
    <div id="searchView" class="view active">
      <input id="q" placeholder="Search music..." />
      <button onclick="search()">Search</button>

      <div id="results"></div>
    </div>

    <!-- QUEUE VIEW -->
    <div id="queueView" class="view">
      <h3>Queue</h3>
      <div id="queue"></div>
    </div>

  </div>

  <!-- PLAYER -->
  <div class="player">
    <iframe id="spotify"></iframe>
    <iframe id="audius"></iframe>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
